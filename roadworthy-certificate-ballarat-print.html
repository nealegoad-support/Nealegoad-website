<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Roadworthy Certificate · Wendouree &amp; Ballarat — Neale Goad Automotive (Print)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&family=Barlow+Semi+Condensed:wght@600;700&display=swap" />
<link rel="stylesheet" href="app/styles.css" />
<link rel="stylesheet" href="app/layout.css" />
<style>
  html,body{ margin:0; background:var(--bg); }
  #root{ min-height:100%; }
  .stage[data-mode="desktop"]{ min-height:auto; background:var(--bg); }

  /* keep the page dark and rich on screen preview too */
  body{ background:var(--bg); }

  /* ---- always-visible content (kill the scroll-reveal hidden state) ---- */
  [data-reveal]{ opacity:1 !important; transform:none !important; }

  /* header should not be sticky/floating in a paged document */
  .hdr{ position:static !important; background:rgba(17,20,25,.9) !important; border-bottom:1px solid var(--line) !important; }

  @media print{
    @page{ size: A4 portrait; margin: 11mm; }

    html,body{ background:#111419 !important; }
    *{
      -webkit-print-color-adjust:exact !important;
      print-color-adjust:exact !important;
    }
    /* the grid wash + glows muddy print — drop them */
    .ng::before, .final-glow, .tactical::after, .hero::after, .hero::before{ display:none !important; }

    /* tighten vertical rhythm so we don't waste pages */
    .section{ padding:34px 0 !important; }
    .hero{ padding:24px 0 0 !important; }
    .fleet-band{ padding:34px 0 !important; }
    .ft{ padding:34px 0 18px !important; }

    /* keep coherent blocks together on a page */
    .pillar, .media, .tactical, .final, .badge-pill, .hstat,
    .fleet-contract, .heritage-in, .hero-grid, .section-head{
      break-inside: avoid;
    }
    .section, .fleet-band{ break-inside: avoid-page; }
    h1, h2, h3{ break-after: avoid; }

    /* hero image can be tall — let it sit naturally */
    .hero-img{ max-height: 360px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="app/icons.jsx"></script>
<script type="text/babel" src="app/sections.jsx"></script>
<script type="text/babel" src="app/print-main.jsx"></script>
</body>
</html>
