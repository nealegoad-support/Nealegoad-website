<style>
  html,body{ margin:0; background:#0c0e11; }
  body{ min-height:100%; }
  #root{ min-height:100%; }
  .stage{ position:relative; }
  .stage[data-mode="desktop"]{ min-height:100vh; background:var(--bg); }
  .stage[data-mode="mobile"]{ height:100vh; }

  /* desktop = the document scrolls naturally */
  .desktop-flow{ background:var(--bg); }

  /* mobile = device bezel on a neutral backdrop */
  .phone-stage{
    height:100vh; display:grid; place-items:center;
    background:
      radial-gradient(120% 80% at 50% 0%, #15181d 0%, #0a0b0e 70%);
  }
  .phone{
    width:390px; height:844px; flex:none;
    border-radius:46px;
    background:#000;
    padding:11px;
    box-shadow:0 0 0 2px #2a2e36, 0 50px 90px -40px rgba(0,0,0,.9), 0 0 0 11px #16181d;
    transform-origin:center center;
    position:relative;
  }
  .phone-notch{
    position:absolute; top:20px; left:50%; transform:translateX(-50%);
    width:118px; height:30px; background:#000; border-radius:999px; z-index:60;
  }
  .phone-screen{
    width:100%; height:100%; overflow-y:auto; overflow-x:hidden;
    border-radius:36px; background:var(--bg);
    -webkit-overflow-scrolling:touch;
  }
  .phone-screen::-webkit-scrollbar{ width:0; height:0; }
  .phone-screen{ scrollbar-width:none; }
  .bk-modal::-webkit-scrollbar{ width:8px; }
  .bk-modal::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.14); border-radius:8px; }

  /* viewport toggle pill */
  .vp-toggle{
    position:fixed; left:50%; bottom:20px; transform:translateX(-50%);
    z-index:100; display:flex; align-items:center; gap:6px;
    background:rgba(20,23,28,.9); backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.12); border-radius:999px;
    padding:6px 6px 6px 16px;
    box-shadow:0 18px 40px -18px rgba(0,0,0,.8);
    font-family:'Barlow',system-ui,sans-serif;
  }
  .vp-label{ font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:#7b828d; margin-right:4px; }
  .vp-toggle button{
    display:inline-flex; align-items:center; gap:7px;
    font-family:inherit; font-weight:600; font-size:14px;
    color:#aab0ba; background:transparent; border:none; cursor:pointer;
    padding:9px 15px; border-radius:999px; transition:.15s;
  }
  .vp-toggle button:hover{ color:#f3f5f7; }
  .vp-toggle button.on{ background:var(--accent); color:#161300; }
  .vp-toggle button.on svg{ stroke:#161300; }

  @media (max-width:640px){
    .vp-toggle{ bottom:auto; top:10px; padding:5px 5px 5px 12px; }
    .vp-label{ display:none; }
  }
</style>
</head>
